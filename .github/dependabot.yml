version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Not optional given the SHA-pinning in .github/workflows/: a pinned action
  # is frozen at whatever that commit contained, security fixes included.
  # Pinning without this just trades "silent change" for "silent staleness".
  # Dependabot rewrites the SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
