name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege at the workflow level; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20' # matches package.json engines: >=20
          cache: npm
      # node-pty builds a native addon; ubuntu-latest already ships
      # python3/make/g++, so no extra install step is needed.
      - run: npm ci
      - run: npm test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit, not just the diff
          persist-credentials: false

      # Installed from the upstream release rather than gitleaks-action: the
      # action is proprietary (Gitleaks LLC, commercial EULA) while the CLI is
      # MIT. This also keeps third-party JS out of CI and pins by checksum
      # rather than trusting a mutable tag.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .
